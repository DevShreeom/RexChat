[project]
name = "rex-chat"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Om Jadhav", email = "jadhavos2008@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "argon2-cffi>=25.1.0",
    "flask>=3.1.3",
    "flask-socketio>=5.7.2",
    "pynacl>=1.6.2",
    "python-socketio[client]>=5.18.1",
    "requests>=2.34.2",
    "simple-websocket>=1.1.0",
    "textual>=8.2.8",
]

[project.scripts]
rex-chat = "rex_chat:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
